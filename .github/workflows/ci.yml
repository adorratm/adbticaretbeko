name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build core services
        run: |
          set -e
          for svc in gateway auth customer catalog cart checkout order payment shipment notification search review wishlist marketplace accounting worker; do
            echo "== $svc =="
            (cd "services/backend/$svc" && go build -o /dev/null ./cmd/$svc/)
          done

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Typecheck packages/apps
        run: yarn turbo run typecheck --filter=@adb/api-client --filter=@adb/api-types --filter=@adb/storefront --filter=@adb/admin
